<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Lock Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
</head>
<body>
  <div class="glow"></div>
  <div class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">Smart Lock</div>
        <h1>Pannello di controllo</h1>
      </div>
      <form method="post" action="{{ url_for('logout') }}">
        <button class="btn ghost" type="submit">Logout</button>
      </form>
    </header>

    {% if not config_ok %}
    <div class="alert wide">
      Missing config: {{ config_errors | join(', ') }}
    </div>
    {% endif %}

    <main class="grid">
      <section class="card">
        <h2>Registra nuova impronta</h2>
        <form id="enroll-form" class="stack">
          <label class="field">
            <span>Nome</span>
            <input id="first-name" type="text" required />
          </label>
          <label class="field">
            <span>Cognome</span>
            <input id="last-name" type="text" required />
          </label>
          <button class="btn primary" type="submit">Inserisci</button>
        </form>
      </section>

      <section class="card">
        <h2>Stato</h2>
        <div class="status" id="status-badge">Idle</div>
        <div class="status-details" id="status-details">Waiting for a new enrollment.</div>
        <div class="status-id" id="status-id"></div>
      </section>

      <section class="card wide">
        <h2>Attività</h2>
        <div class="log" id="activity-log"></div>
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
